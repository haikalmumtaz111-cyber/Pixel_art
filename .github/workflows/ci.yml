# Pemeriksaan otomatis untuk setiap pull request dan push ke main.
# Ringan: lint, unit test mesin, validasi konfigurasi semua proyek, dan uji asap beberapa frame per proyek.
# Render video penuh tidak dijalankan di sini (dikerjakan lokal dengan "npm run build -- --all").
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, unit test, validasi konfigurasi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Pembanding tepercaya untuk baseline historis: cabang tujuan PR, atau commit main sebelum push.
      # Isinya tidak bisa diubah oleh perubahan yang sedang diuji, jadi file baseline lama yang diubah bersama
      # hash registry-nya tetap tertangkap (lint hanya membandingkan file dengan registry di folder yang sama).
      - name: Baseline historis tidak berubah dibanding main
        env:
          GUARD_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$GUARD_REF"
          npm run test:baseline-guard -- --ref FETCH_HEAD
      - run: npm run test:engine
      - run: npm run projects

  smoke:
    name: Uji asap render dan lab zoom
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pasang FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Pasang Chromium untuk Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:smoke
      - name: Lab zoom (grid piksel kamera)
        run: npm run test:zoom
